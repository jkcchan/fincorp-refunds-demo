{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="narrow card">
  <h1>Sign in</h1>
  <p>Local demo accounts only. No SSO connection.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button>Sign in</button>
  </form>
</section>
{% endblock %}
